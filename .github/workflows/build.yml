name: NexaBuild Engine

on:
  workflow_dispatch:
    inputs:
      project_type:
        description: 'Tipe project (url/html)'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
      app_id:
        description: 'Package ID'
        required: true
      version_name:
        description: 'Version Name'
        required: true
      version_code:
        description: 'Version Code'
        required: true
      target_url:
        description: 'Target URL Web'
        required: false

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Buat Proyek Android dengan Python (Anti-Error)
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          APP_ID: ${{ github.event.inputs.app_id }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          TARGET_URL: ${{ github.event.inputs.target_url }}
        run: |
          python3 -c '
          import os, json

          app_name = os.environ["APP_NAME"]
          app_id = os.environ["APP_ID"]
          v_name = os.environ["VERSION_NAME"]
          v_code = os.environ["VERSION_CODE"]
          target_url = os.environ["TARGET_URL"] or "https://google.com"

          # Buat struktur folder
          os.makedirs("app/src/main/java/com/nexa/browser", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)
          os.makedirs("app/src/main/res/mipmap-hdpi", exist_ok=True)
          os.makedirs("app/src/main/assets", exist_ok=True)

          with open("settings.gradle", "w") as f:
              f.write("include \x27:app\x27\n")

          with open("build.gradle", "w") as f:
              f.write("""
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath \x27com.android.tools.build:gradle:7.4.2\x27 }
          }
          allprojects { repositories { google(); mavenCentral() } }
          task clean(type: Delete) { delete rootProject.buildDir }
          """)

          with open("app/build.gradle", "w") as f:
              f.write(f"""
          plugins { id \x27com.android.application\x27 }
          android {{
              compileSdk 33
              defaultConfig {{
                  applicationId "{app_id}"
                  minSdk 21
                  targetSdk 33
                  versionCode {v_code}
                  versionName "{v_name}"
              }}
              buildTypes {{
                  release {{
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile(\x27proguard-android-optimize.txt\x27), \x27proguard-rules.pro\x27
                  }}
              }}
          }}
          dependencies {{ implementation \x27androidx.appcompat:appcompat:1.6.1\x27 }}
          """)

          with open("app/src/main/AndroidManifest.xml", "w") as f:
              f.write(f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="{app_id}">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:label="{app_name}" android:usesCleartextTraffic="true" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """)

          with open("app/src/main/java/com/nexa/browser/MainActivity.java", "w") as f:
              f.write(f"""
          package com.nexa.browser;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {{
              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("{target_url}");
                  setContentView(webView);
              }}
          }}
          """)
          '

          gradle wrapper

      - name: Build APK via Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Zipalign & Sign APK
        run: |
          cd app/build/outputs/apk/release
          $ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign -v -p 4 app-release-unsigned.apk app-aligned.apk
          keytool -genkey -v -keystore release.keystore -alias nexa_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Nexa, O=Nexa, C=ID"
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-key-alias nexa_alias --ks-pass pass:password --key-pass pass:password --out app-release.apk app-aligned.apk

      - name: Upload Release APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ github.event.inputs.version_name }}-${{ github.run_id }}"
          name: "${{ github.event.inputs.app_name }} v${{ github.event.inputs.version_name }}"
          body: "APK siap diinstal langsung dari halaman rilis."
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
