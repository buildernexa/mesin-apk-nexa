name: NexaBuild Engine

on:
  workflow_dispatch:
    inputs:
      project_type:
        description: 'Tipe project (url/html)'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
      app_id:
        description: 'Package ID'
        required: true
      version_name:
        description: 'Version Name'
        required: true
      version_code:
        description: 'Version Code'
        required: true
      target_url:
        description: 'Target URL Web'
        required: false

jobs:
  build:
    name: Build & Sign APK (Direct Engine)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Buat Struktur Proyek Android Native
        run: |
          # Membuat kerangka proyek Android standar tanpa bergantung pada CLI pihak ketiga
          mkdir -p native-app/app/src/main/java/com/nexa/app
          mkdir -p native-app/app/src/main/assets
          mkdir -p native-app/app/src/main/res/values
          mkdir -p native-app/app/src/main/res/mipmap-hdpi
          
          cd native-app
          
          # Buat settings.gradle
          echo "include ':app'" > settings.gradle
          
          # Buat root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          # Buat app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              compileSdk 33
              defaultConfig {
                  applicationId "${{ github.event.inputs.app_id }}"
                  minSdk 21
                  targetSdk 33
                  versionCode ${{ github.event.inputs.version_code }}
                  versionName "${{ github.event.inputs.version_name }}"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.8.0'
          }
          EOF

          # Buat AndroidManifest.xml dengan izin akses internet penuh untuk WebView
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="${{ github.event.inputs.app_id }}">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="${{ github.event.inputs.app_name }}"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Buat MainActivity.java yang langsung meload URL target Anda ke dalam WebView
          TARGET_URL="${{ github.event.inputs.target_url }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://google.com"
          fi

          cat << EOF > app/src/main/java/com/nexa/app/MainActivity.java
          package com.nexa.app;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("$TARGET_URL");
                  setContentView(webView);
              }
          }
          EOF

          # Buat ikon placeholder sederhana agar gradle tidak error saat cari mipmap
          echo '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#000" android:pathData="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2Z"/></vector>' > app/src/main/res/mipmap-hdpi/ic_launcher.xml
          cp app/src/main/res/mipmap-hdpi/ic_launcher.xml app/src/main/res/mipmap-hdpi/ic_launcher_round.xml

      - name: Kompilasi APK (Gradle Build)
        run: |
          cd native-app
          chmod +x gradlew || gradle wrapper
          ./gradlew assembleRelease --no-daemon

      - name: Zipalign APK (Native Android SDK)
        run: |
          cd native-app/app/build/outputs/apk/release
          $ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign -v -p 4 app-release-unsigned.apk app-aligned.apk

      - name: Generate Production Keystore
        run: |
          cd native-app/app/build/outputs/apk/release
          keytool -genkey -v -keystore release.keystore -alias nexa_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=${{ github.event.inputs.app_name }}, OU=NexaBuild, O=Nexa, L=Jakarta, ST=Jakarta, C=ID"

      - name: Sign APK (Native Android SDK)
        run: |
          cd native-app/app/build/outputs/apk/release
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-key-alias nexa_alias --ks-pass pass:password --key-pass pass:password --out app-release.apk app-aligned.apk

      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ github.event.inputs.version_name }}-${{ github.run_id }}"
          name: "${{ github.event.inputs.app_name }} v${{ github.event.inputs.version_name }}"
          body: "Build sukses sempurna!\nTarget URL: ${{ github.event.inputs.target_url }}"
          files: native-app/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
