name: NexaBuild Engine

on:
  workflow_dispatch:
    inputs:
      project_type:
        description: 'Tipe project (url/html)'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
      app_id:
        description: 'Package ID'
        required: true
      version_name:
        description: 'Version Name'
        required: true
      version_code:
        description: 'Version Code'
        required: true
      target_url:
        description: 'Target URL Web'
        required: false

jobs:
  build:
    name: Build & Sign APK (Anti-Error)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create Capacitor Android Project
        run: |
          mkdir engine-app && cd engine-app
          npm init -y
          npm install @capacitor/cli @capacitor/core @capacitor/android
          npx cap init "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.app_id }}" --web-dir www
          mkdir www
          
          # Injeksi URL Target
          if [ "${{ github.event.inputs.target_url }}" != "" ]; then
            node -e "
              const fs = require('fs');
              let cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
              cfg.server = { url: '${{ github.event.inputs.target_url }}', cleartext: true };
              fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
            "
            echo "<html><body style='background:#fff;color:#000;'>Memuat ${ { github.event.inputs.app_name } }...</body></html>" > www/index.html
          else
            echo "<html><body>Menunggu Konfigurasi...</body></html>" > www/index.html
          fi
          
          # Tambahkan platform Android dan lakukan SINKRONISASI (Celah Error Diperbaiki)
          npx cap add android
          npx cap sync android

      - name: Inject Version Data
        run: |
          cd engine-app/android/app
          sed -i "s/versionCode 1/versionCode ${{ github.event.inputs.version_code }}/g" build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ github.event.inputs.version_name }}\"/g" build.gradle

      - name: Compile Release APK (Gradle)
        run: |
          cd engine-app/android
          chmod +x gradlew
          # Tambahan --no-daemon untuk mencegah memory crash di GitHub Actions
          ./gradlew assembleRelease --no-daemon

      - name: Zipalign APK (Native Android SDK)
        run: |
          cd engine-app/android/app/build/outputs/apk/release
          $ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign -v -p 4 app-release-unsigned.apk app-aligned.apk

      - name: Generate Production Keystore
        run: |
          cd engine-app/android/app/build/outputs/apk/release
          keytool -genkey -v -keystore release.keystore -alias nexa_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=${{ github.event.inputs.app_name }}, OU=NexaBuild, O=Nexa, L=Jakarta, ST=Jakarta, C=ID"

      - name: Sign APK (Native Android SDK)
        run: |
          cd engine-app/android/app/build/outputs/apk/release
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-key-alias nexa_alias --ks-pass pass:password --key-pass pass:password --out app-release.apk app-aligned.apk

      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ github.event.inputs.version_name }}-${{ github.run_id }}"
          name: "${{ github.event.inputs.app_name }} v${{ github.event.inputs.version_name }}"
          body: "Automated Build WebView.\nTarget: ${{ github.event.inputs.target_url }}"
          files: engine-app/android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
